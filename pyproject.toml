[project]
name = "minback"
version = "2.0.0"
description = "MariaDB backups to S3-compatible storage and FTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43",
    "croniter>=6.2",
    "prometheus-client>=0.26",
]

[project.scripts]
minback = "minback.__main__:main"

[dependency-groups]
dev = [
    "moto[s3]>=5.2",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
